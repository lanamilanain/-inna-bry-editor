<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E1D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Загряжское Студия</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Overpass:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: linen workspace, the preview is the hero. Mobile: header / slide strip / preview / tool panel / dock.
   Desktop (>=900px): preview on the left, dock + tool panel in a right column. */
:root{
  --bg:#E8DECB; --surface:#F6EFE1; --surface2:#EDE3CF; --ink:#2E1D14; --muted:#74604E; --line:#D4C5A6;
  --gold:#C29A4F; --gold-ink:#7E5A1B; --on-gold:#2E1D14; --danger:#9A3B2B; --shadow:rgba(46,29,20,.28);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17100B; --surface:#241811; --surface2:#33241A; --ink:#F2E7D2; --muted:#BBA68A; --line:#473322;
  --gold:#C9A45C; --gold-ink:#DDBB7B; --on-gold:#2E1D14; --danger:#E58F78; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17100B; --surface:#241811; --surface2:#33241A; --ink:#F2E7D2; --muted:#BBA68A; --line:#473322;
  --gold:#C9A45C; --gold-ink:#DDBB7B; --on-gold:#2E1D14; --danger:#E58F78; --shadow:rgba(0,0,0,.55); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:500 14px/1.35 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,textarea,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{height:100%;display:grid;gap:0;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"hd" "banner" "strip" "stage" "panel" "dock"}
#hd{grid-area:hd;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:600 24px/1 var(--serif);letter-spacing:.2px;white-space:nowrap}
.brand span{font:700 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
.hd-r{display:flex;align-items:center;gap:10px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#6E9A5B}
.status[data-s="saving"]::before{background:var(--gold)}
.status[data-s="error"]::before,.status[data-s="memory"]::before{background:var(--danger)}
#banner{grid-area:banner;margin:0 0 6px;padding:8px 12px;border-radius:10px;background:var(--surface2);color:var(--danger);font-size:12.5px}
#stripWrap{grid-area:strip;min-width:0}
#strip{display:flex;gap:8px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 auto;height:54px;border-radius:8px;padding:0;border:2px solid transparent;background:var(--surface2);overflow:visible;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.thumb canvas{display:block;height:100%;width:auto;border-radius:6px;pointer-events:none}
.thumb i{position:absolute;left:3px;bottom:3px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;background:rgba(46,29,20,.78);color:#F3E8D3;font:700 10px/16px var(--sans);text-align:center;font-style:normal;pointer-events:none}
.thumb.on{border-color:var(--gold)}
.thumb.dragging{z-index:5;opacity:.85;box-shadow:0 8px 20px var(--shadow)}
.thumb.drop::before{content:"";position:absolute;left:-6px;top:0;bottom:0;width:3px;border-radius:2px;background:var(--gold)}
.thumb.dropend::after{content:"";position:absolute;right:-6px;top:0;bottom:0;width:3px;border-radius:2px;background:var(--gold)}
.thumb.add{width:54px;display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted)}
.thumb.add svg{width:22px;height:22px}

#stage{grid-area:stage;min-height:0;min-width:0;display:flex;overflow:hidden}
#stageInner{position:relative;flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0}
#cvWrap{position:relative;flex:0 0 auto;box-shadow:0 12px 34px var(--shadow);border-radius:2px;background:#2E1D14}
#cv{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
#addzone{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:rgba(255,255,255,.04);color:#E9DBBE;outline:1.5px dashed rgba(233,219,190,.55);outline-offset:-10px;cursor:pointer;padding:18px}
#addzone b{font:600 22px/1.1 var(--serif)}
#addzone small{font-size:12px;opacity:.85}
#addzone svg{width:30px;height:30px}
#empty{text-align:center;display:grid;gap:14px;justify-items:center;max-width:300px}
#empty h2{margin:0;font:600 28px/1.1 var(--serif)}
#empty p{margin:0;color:var(--muted)}

#panel{grid-area:panel;height:clamp(150px,25vh,214px);overflow-y:auto;overflow-x:hidden;padding:10px 2px 8px;display:flex;flex-direction:column;gap:10px;min-width:0;-webkit-overflow-scrolling:touch}
#app[data-panel="closed"] #panel{display:none}
#dock{grid-area:dock;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0 8px;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.hint{color:var(--muted);font-size:12.5px;line-height:1.4}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:700;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--gold);border-color:transparent;color:var(--on-gold)}
.btn.danger{color:var(--danger)}
.btn.on{box-shadow:inset 0 0 0 2px var(--gold)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sq{width:44px;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:0 0 auto}
.pts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.pt{position:relative;flex:0 0 auto;width:48px;height:48px;border-radius:10px;padding:0;overflow:hidden;border:2px solid var(--line);background:var(--surface2)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt i{position:absolute;left:3px;bottom:3px;min-width:15px;height:15px;border-radius:8px;background:rgba(46,29,20,.8);color:#F3E8D3;font:700 10px/15px var(--sans);text-align:center;font-style:normal}
.pt.on{border-color:var(--gold)}
.pt.dim img{opacity:.35}
textarea#txt{width:100%;min-height:60px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px;line-height:1.35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg .btn{border:0;border-radius:0;background:var(--surface2);min-width:44px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.seg[aria-label="Шрифт"]{display:flex;flex-wrap:wrap;gap:6px;overflow:visible;border:0}.seg[aria-label="Шрифт"] .btn{border:1px solid var(--line);border-radius:10px;min-width:0}.seg[aria-label="Шрифт"] .btn+.btn{border-left:1px solid var(--line)}
.step{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.step b{min-width:30px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.swrap{display:flex;gap:10px;align-items:center;padding:4px 6px}
.tplgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tplgrid .btn{flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;white-space:normal;text-align:left;min-height:52px}
.tplgrid small{font-weight:500;color:var(--muted);font-size:11.5px}
.lbl{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);
  background:#2E1D14;color:#F3E8D3;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px var(--shadow);pointer-events:none}
#modal{position:fixed;inset:0;z-index:40;background:rgba(20,12,7,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:10px;max-height:90%;overflow:auto}
.sheet h3{margin:0;font:600 26px/1.1 var(--serif)}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.sheet .btn{justify-content:flex-start;width:100%}
.sheet .btn small{font-weight:500;color:var(--muted);margin-left:auto}
.sheet img.view{width:100%;border-radius:10px;background:var(--surface2)}
.sheet .btn.primary small{color:var(--on-gold);opacity:.75}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}

@media (max-width:520px){.brand span{display:none}.status{font-size:11.5px}}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 380px;column-gap:24px;
    grid-template-rows:auto auto auto auto minmax(0,1fr);
    grid-template-areas:"hd hd" "banner banner" "strip strip" "stage dock" "stage panel"}
  #stage{grid-row:4/6}
  #panel{height:auto;padding-top:14px}
  #app[data-panel="closed"] #panel{display:flex}
  #dock{border-top:0;border-bottom:1px solid var(--line);padding-top:0}
  #modal{align-items:center}
  .sheet{border-radius:20px}
  #toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const thumbs = s.photos.map((p, k) => { const im = IM.get(p.pid); return '<button type="button" class="pt' + (k === i ? ' on' : '') + (k >= T.max ? ' dim' : '') + '" data-act="photo-select" data-i="' + k + '" aria-label="Фото ' + (k + 1) + '"><img alt="" src="' + (im ? im.thumb : '') + '"><i>' + (k + 1) + '</i></button>'; }).join('');
  let hint = 'Тяните фото пальцем, двумя пальцами меняйте масштаб.';
  if (!s.photos.length) hint = 'Нажмите на пустую область макета или «Добавить фото».';
  else if (i >= T.max) hint = 'В шаблоне «' + T.name + '» это фото скрыто. Сдвиньте его на первое место стрелкой влево.';
  else if (s.photos.length > T.max) hint = 'В этом шаблоне видно только первое фото, остальные сохранены.';
  if (T.plain) return '<div class="hint">В этом макете используется только фон и текст, фотография не нужна.</div>';
  return '<div class="row"><label class="btn primary" for="file" role="button">' + ICON.plus + '<span>Фото</span></label>' +
    BTN('photo-reset', 'Сброс', { icon: 'reset', dis: i < 0 }) + BTN('photo-del', 'Удалить', { icon: 'trash', cls: 'danger', dis: i < 0 }) + '</div>' +
    (s.photos.length ? '<div class="row"><div class="pts">' + thumbs + '</div>' +
      BTN('photo-move', '', { icon: 'left', cls: 'sq', data: { d: -1 }, dis: i < 1, aria: 'Фото раньше' }) + BTN('photo-move', '', { icon: 'right', cls: 'sq', data: { d: 1 }, dis: i < 0 || i >= s.photos.length - 1, aria: 'Фото позже' }) + '</div>' : '') +
    '<div class="hint">' + hint + '</div>';
}
function textPanel(s) {
  const T = TEMPLATES[s.tpl], k = selText();
  const chips = T.blocks.map(b => BTN('text-select', BLOCKS[b].label, { cls: b === k ? 'on' : '', data: { key: b } })).join('');
  let h = '<div class="chips">' + chips + '</div>';
  if (!k) return h + '<div class="hint">Выберите блок выше или коснитесь текста на макете. Текст двигается пальцем. Пустой блок на макете не показывается.</div>';
  const t = s.texts[k], B = BLOCKS[k];
  h += '<textarea id="txt" rows="2" maxlength="400" aria-label="' + esc(B.label) + '">' + esc(t.text) + '</textarea>';
  h += '<div class="row"><div class="seg" role="group" aria-label="Шрифт">' + Object.keys(FONTS).map(f => '<button type="button" class="btn' + (t.font === f ? ' on' : '') + '" data-act="text-font" data-f="' + f + '" style="font-family:\'' + FONTS[f].css + '\',serif">' + FONTS[f].label + '</button>').join('') + '</div></div>';
  h += '<div class="row"><span class="step"><span>Размер</span>' + BTN('text-size', 'A−', { cls: 'sq', data: { d: -1 }, aria: 'Меньше' }) + '<b>' + Math.round(t.size) + '</b>' + BTN('text-size', 'A+', { cls: 'sq', data: { d: 1 }, aria: 'Больше' }) + '</span>';
  if (!B.plate) h += '<span class="step"><span>Ширина</span>' + BTN('text-width', '', { icon: 'left', cls: 'sq', data: { d: -1 }, aria: 'Уже' }) + '<b>' + Math.round(t.w * 100) + '</b>' + BTN('text-width', '', { icon: 'right', cls: 'sq', data: { d: 1 }, aria: 'Шире' }) + '</span>';
  h += '</div><div class="row"><span class="swrap" role="group" aria-label="' + (B.plate ? 'Цвет плашки' : 'Цвет текста') + '">' + Object.keys(COLORS).map(c => '<button type="button" class="sw' + (t.color === c ? ' on' : '') + '" data-act="text-color" data-c="' + c + '" style="background:' + COLORS[c] + '" aria-label="' + COLOR_NAMES[c] + '"></button>').join('') + '<label class="sw" title="Свой цвет" style="display:grid;place-items:center;overflow:hidden"><input type="color" data-act="text-custom-color" value="' + (COLORS[t.color] || t.color || '#F3E8D3') + '" style="width:42px;height:42px;border:0;padding:0;background:none"></label></span>';
  if (!B.plate) h += '<div class="seg" role="group" aria-label="Выравнивание">' + ['left', 'center', 'right'].map(a => '<button type="button" class="btn sq' + (t.align === a ? ' on' : '') + '" data-act="text-align" data-a="' + a + '" aria-label="' + a + '">' + ICON['align' + a[0]] + '</button>').join('') + '</div>' + BTN('text-italic', '', { icon: 'italic', cls: 'sq' + (t.italic ? ' on' : ''), aria: 'Курсив' });
  h += BTN('text-reset', 'На место', { icon: 'reset', dis: !t.pos }) + '</div>';
  return h;
}
function layoutPanel(s) {
  const T = TEMPLATES[s.tpl], canVar = s.photos.length >= 2 && T.max > 1 && Math.min(s.photos.length, T.max) >= 2;
  return '<div class="lbl">Шаблон</div><div class="tplgrid">' + Object.keys(TEMPLATES).map(k => '<button type="button" class="btn' + (s.tpl === k ? ' on' : '') + '" data-act="tpl" data-t="' + k + '">' + TEMPLATES[k].name + '<small>' + TEMPLATES[k].note + '</small></button>').join('') + '</div>' +
    ((TEMPLATES[s.tpl].overlay || TEMPLATES[s.tpl].plain) ? '<div class="lbl">Цвет фона</div><div class="row"><span class="swrap">' + BRAND_PALETTE.map(c => '<button type="button" class="sw' + (s.bg === c ? ' on' : '') + '" data-act="bg-preset" data-c="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join('') + '</span><label class="btn">Свой цвет <input type="color" data-act="bg-color" value="' + (s.bg || '#4B3022') + '" style="width:26px;height:26px;border:0;padding:0;background:none"></label></div>' : '') +
    '<div class="lbl">Формат</div><div class="row"><div class="seg" role="group" aria-label="Формат">' + Object.keys(FORMATS).map(f => '<button type="button" class="btn' + (S.format === f ? ' on' : '') + '" data-act="fmt" data-f="' + f + '">' + FORMATS[f].name + ' ' + FORMATS[f].ratio + '</button>').join('') + '</div></div>' +
    '<div class="row">' + BTN('variant', 'Раскладка фото', { icon: 'grid', dis: !canVar }) + BTN('texts-reset', 'Тексты на место', { icon: 'reset' }) + '</div>';
}
