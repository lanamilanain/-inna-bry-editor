name: Deploy Christmas Mail to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'advent-vasilisa-2026/**'
      - '.github/workflows/advent-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: advent-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add Vasilisa Advent under its own path
        run: |
          mkdir -p site/advent-vasilisa-2026
          cp -R advent-vasilisa-2026/. site/advent-vasilisa-2026/
      - name: Upload Advent site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Allow Pages artifact registration
        run: sleep 10
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
